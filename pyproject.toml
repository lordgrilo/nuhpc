[project]
name = "nuhpc"
version = "0.1.0"
description = "Agent-friendly CLI for Slurm jobs on Northeastern's Explorer cluster"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nuhpc = "nuhpc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
nuhpc = ["templates/*.sbatch", "example_config.toml"]
