[project]
name = "nuhpc"
version = "0.8.3"
description = "Agent-friendly CLI for Northeastern's Explorer cluster: Slurm jobs, environments, data, usage and disk"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
nuhpc = "nuhpc.cli:main"

[build-system]
requires = ["setuptools>=77"]   # SPDX license field (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["nuhpc"]   # explicit: skill/ and examples/ would otherwise break flat-layout discovery

[tool.setuptools.package-data]
nuhpc = ["templates/*.sbatch", "example_config.toml"]
