# nuhpc config: ~/.config/nuhpc/config.toml
# Values marked VERIFY are guesses about Explorer: confirm with `nuhpc check` / RC docs.

ssh_host = "explorer"                     # Host alias from ~/.ssh/config (see README)
remote_root = "/scratch/YOUR_USER/nuhpc"  # all runs/, data/ live here. VERIFY scratch purge policy;
                                          # anything you need to keep: fetch it, or use /projects/<group>.
local_results = "~/nuhpc-results"
templates_dir = ""                        # optional dir with your own *.sbatch templates (shadows built-ins)
default_profile = "gpu1"

# Pasted verbatim at the top of every job, after Slurm directives.
env_setup = """
source /projects/YOUR_GROUP/envs/llm/bin/activate   # a uv venv built inside a job: README "Python environment"
# module load cuda/12.8.0                      # modules: 12.1.1, 12.3.0, 12.8.0, 13.2.0. pip torch bundles CUDA
export HF_HOME=/projects/YOUR_GROUP/hf_cache   # keep model weights off $HOME; /scratch/$USER if it is writable
export HF_HUB_OFFLINE=1                        # cached weights only (compute nodes do have internet; this is for reproducibility)
export TOKENIZERS_PARALLELISM=false
"""

[limits]                         # guardrails, mainly for agents. --confirm-big bypasses them.
max_gpu_hours_per_submit = 64    # worst case: gpus * nodes * walltime * tasks
max_tasks = 200
default_max_parallel = 8         # array throttle unless --max-parallel given
fetch_max_file_size = "1G"       # fetch skips bigger files (checkpoints) unless --max-size

# Profiles. Seen with `nuhpc check` on 2026-10-07: gpu (8h max; a100, h200, t4, v100 types),
# gpu-short / gpu-interactive (2h), short (CPU, default, 2 days). Re-check: access varies by account.
[profiles.cpu]
partition = "short"
cpus = 8
mem = "32G"
time = "04:00:00"

[profiles.gpu1]
partition = "gpu"
cpus = 8
mem = "64G"
time = "08:00:00"
gres = "gpu:1"

[profiles.a100x1]
partition = "gpu"
cpus = 12
mem = "120G"
time = "08:00:00"
gres = "gpu:a100:1"

[profiles.h200x1]
partition = "gpu"
cpus = 16
mem = "200G"
time = "08:00:00"
gres = "gpu:h200:1"

[profiles.multigpu]              # 4 GPUs on one node, for 70B-class TP or DDP. The multigpu partition is
partition = "multigpu"           # invisible until RC grants access; without it try partition "gpu" (8h). VERIFY
cpus = 32
mem = "400G"
time = "24:00:00"
gres = "gpu:a100:4"

[globus]                         # optional, for big transfers: `nuhpc push --globus`
local_endpoint = ""              # your Globus Connect Personal endpoint UUID
remote_endpoint = ""             # Northeastern RC endpoint UUID (search "Northeastern" in Globus)
