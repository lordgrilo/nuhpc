# nuhpc config: ~/.config/nuhpc/config.toml
# Values marked VERIFY are guesses about Explorer: confirm with `nuhpc check` / RC docs.

ssh_host = "explorer"                     # Host alias from ~/.ssh/config (see README)
user_dir = "/projects/YOUR_GROUP/YOUR_USER"   # YOUR folder on project storage (`nuhpc init --user-dir` sets it).
                                          # Installs live here: envs/ and hf_cache/, shared by all your projects.
                                          # Runs and data go to <user_dir>/nuhpc/, or to a declared project (below).
                                          # Project storage is not purged; scratch may be purged or unwritable.
# remote_root = "..."                     # optional: put the default runs/ and data/ somewhere other than
                                          # <user_dir>/nuhpc (older configs set only this; it then also holds envs/)
local_results = "~/nuhpc-results"
templates_dir = ""                        # optional dir with your own *.sbatch templates (shadows built-ins)
default_profile = "a100x1"                # gpu1 can land on a 16 GB T4 or an untested V100

# Project directories, chosen with `--project NAME` on submit, run, push, pull, ls and check. Each project keeps
# its runs/ and data/ in <dir>/nuhpc/; envs and the HF cache stay in user_dir. A project name with no entry here
# is only a tag (for `nuhpc usage`) and uses the default location. Only directories listed here can be used.
# [projects.miller]
# dir = "/projects/YOUR_GROUP/YOUR_USER/miller"

# Pasted verbatim at the top of every job, after Slurm directives.
# $HPC_USER_DIR is user_dir; $HPC_REMOTE_ROOT is the run's work root (its project's <dir>/nuhpc, or the default).
env_setup = """
source "$HPC_USER_DIR/envs/llm/bin/activate"   # your own env, built once by: nuhpc submit env_build --profile cpu
# module load cuda/12.8.0                      # modules: 12.1.1, 12.3.0, 12.8.0, 13.2.0. pip torch bundles CUDA
export HF_HOME="$HPC_USER_DIR/hf_cache"        # model weights: off $HOME (small quota), shared by your projects
export HF_HUB_OFFLINE=1                        # cached weights only (compute nodes do have internet; this is for reproducibility)
export TOKENIZERS_PARALLELISM=false
"""

[limits]                         # guardrails, mainly for agents. --confirm-big bypasses them.
max_gpu_hours_per_submit = 64    # worst case: gpus * nodes * walltime * tasks
max_tasks = 200
default_max_parallel = 8         # array throttle unless --max-parallel given
fetch_max_file_size = "1G"       # fetch skips bigger files (checkpoints) unless --max-size
small_task_max = 16              # refuse more array tasks than this of <= small_task_cpus CPUs (no GPU) unless packed
small_task_warn = 8              # ... and warn above this many. Every array task counts against the per-user
small_task_cpus = 2              # running-job cap (Explorer: 50 on short). 0 switches the check off.
big_job_cpus = 20                # warn when ONE job asks for more than a typical node has: on Explorer's short
big_job_mem = "60G"              # partition most nodes are 20 cores with about 62 GB

# Profiles. Seen with `nuhpc check` on 2026-10-07: gpu (8h max; a100, h200, t4, v100 types),
# gpu-short / gpu-interactive (2h), short (CPU, default, 2 days). Re-check: access varies by account.
[profiles.cpu]
partition = "short"
cpus = 8
mem = "32G"
time = "04:00:00"

[profiles.gpu1]
partition = "gpu"
cpus = 8
mem = "64G"
time = "08:00:00"
gres = "gpu:1"

[profiles.a100x1]
partition = "gpu"
cpus = 12
mem = "120G"
time = "08:00:00"
gres = "gpu:a100:1"

[profiles.h200x1]
partition = "gpu"
cpus = 16
mem = "200G"
time = "08:00:00"
gres = "gpu:h200:1"

[profiles.multigpu]              # 4 GPUs on one node, for 70B-class TP or DDP. The multigpu partition is
partition = "multigpu"           # invisible until RC grants access; without it try partition "gpu" (8h). VERIFY
cpus = 32
mem = "400G"
time = "24:00:00"
gres = "gpu:a100:4"

[globus]                         # optional, for big transfers: `nuhpc push --globus`
local_endpoint = ""              # your Globus Connect Personal endpoint UUID
remote_endpoint = ""             # Northeastern RC endpoint UUID (search "Northeastern" in Globus)
